<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation | Hawta.ma</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        secondary: "#695c00",
                        "inverse-on-surface": "#9b9d9e",
                        "surface-dim": "#d1d5d7",
                        primary: "#004edc",
                        "on-error-container": "#510017",
                        "surface-container-high": "#e0e3e4",
                        "tertiary-fixed": "#ffffff",
                        surface: "#f5f6f7",
                        outline: "#757778",
                        "on-surface": "#2c2f30",
                        error: "#b41340",
                        "on-primary-fixed-variant": "#002572",
                        "on-primary": "#f1f2ff",
                        "tertiary-dim": "#504f4f",
                        "surface-bright": "#f5f6f7",
                        "inverse-primary": "#658aff",
                        "outline-variant": "#abadae",
                        "on-secondary-container": "#5c5000",
                        "error-dim": "#a70138",
                        "on-tertiary-container": "#636262",
                        "secondary-fixed": "#f9e04c",
                        "on-secondary-fixed": "#473e00",
                        "on-primary-container": "#001c5e",
                        "surface-container-highest": "#dadddf",
                        "surface-tint": "#004edc",
                        "primary-fixed": "#7e9cff",
                        "surface-container-low": "#eff1f2",
                        "tertiary-fixed-dim": "#f3f0ef",
                        "secondary-container": "#f9e04c",
                        "on-secondary": "#fff3c0",
                        "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#0c0f10",
                        tertiary: "#5c5b5b",
                        "on-surface-variant": "#595c5d",
                        "surface-variant": "#dadddf",
                        "on-tertiary": "#f5f2f1",
                        "secondary-dim": "#5b5000",
                        "primary-container": "#7e9cff",
                        "secondary-fixed-dim": "#ead23f",
                        "on-error": "#ffefef",
                        "error-container": "#f74b6d",
                        "tertiary-container": "#ffffff",
                        "on-background": "#2c2f30",
                        "primary-dim": "#0043c1",
                        "on-primary-fixed": "#000000",
                        background: "#f5f6f7",
                        "on-secondary-fixed-variant": "#675a00",
                        "surface-container": "#e6e8ea"
                    },
                    borderRadius: {
                        DEFAULT: "1rem",
                        lg: "2rem",
                        xl: "3rem",
                        full: "9999px"
                    },
                    fontFamily: {
                        headline: ["Manrope"],
                        body: ["Manrope"],
                        label: ["Manrope"],
                        sans: ["Manrope"]
                    },
                    spacing: {
                        '4.5': '1.125rem',
                        '5.5': '1.375rem'
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
        }
        * { font-family: 'Manrope', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Map fills entire screen behind overlays */
        #map { 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Custom Leaflet Markers */
        .custom-marker { background: none !important; border: none !important; }
        .marker-destination {
            width: 52px;
            height: 52px;
            background: #004edc;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,78,220,0.5);
            border: 3px solid white;
            animation: marker-bounce 2s ease-in-out infinite;
        }
        .marker-destination span {
            transform: rotate(45deg);
            color: white;
            font-size: 24px;
            font-variation-settings: "FILL" 1;
        }
        .marker-user {
            width: 20px;
            height: 20px;
            background: #004edc;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 0 0 3px rgba(0,78,220,0.3), 0 4px 12px rgba(0,78,220,0.4);
            position: relative;
        }
        .marker-user::after {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            background: rgba(0,78,220,0.15);
            animation: pulse-user 2s ease-out infinite;
        }

        /* Animated route step markers */
        .marker-step {
            width: 32px;
            height: 32px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            border: 2px solid #004edc;
            font-family: 'Manrope', sans-serif;
            font-weight: 900;
            font-size: 12px;
            color: #004edc;
        }

        @keyframes pulse-user {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(3); opacity: 0; }
        }
        @keyframes marker-bounce {
            0%, 100% { transform: rotate(-45deg) translateY(0); }
            50% { transform: rotate(-45deg) translateY(-6px); }
        }

        /* Override Leaflet attribution styling */
        .leaflet-control-attribution {
            font-family: 'Manrope', sans-serif !important;
            font-size: 9px !important;
            opacity: 0.5;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body antialiased overflow-hidden h-screen">

    <!-- Full-screen Map (sits behind everything) -->
    <div id="map"></div>

    <!-- Navigation Header -->
    <header class="fixed top-0 left-0 w-full z-[50] p-4 px-4">
        <div class="max-w-md mx-auto bg-primary text-white p-5 rounded-[2rem] shadow-2xl shadow-primary/30 flex items-center gap-5 border border-white/20 backdrop-blur-md">
            <button onclick="window.location.href='optimisation.html'" class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center active:scale-90 transition-transform backdrop-blur-sm hover:bg-white/30">
                <span class="material-symbols-outlined font-black">close</span>
            </button>
            <div class="flex-1">
                <p class="text-[10px] font-black uppercase tracking-[0.2em] opacity-70 mb-0.5">En cours vers</p>
                <h1 class="text-lg font-black tracking-tight leading-tight font-headline">Souk Msala (Étape 1)</h1>
            </div>
            <div class="text-right">
                <p class="text-2xl font-black tracking-tighter font-headline">8 <span class="text-sm font-bold">min</span></p>
                <p class="text-[10px] font-bold opacity-70">1.2 km</p>
            </div>
        </div>
    </header>

    <!-- Recenter Button -->
    <button onclick="recenterMap()" class="fixed bottom-52 right-6 z-[40] w-14 h-14 bg-white rounded-full shadow-2xl shadow-slate-300/40 flex items-center justify-center text-primary active:scale-95 transition-all border border-slate-100 hover:shadow-xl">
        <span class="material-symbols-outlined font-black">my_location</span>
    </button>

    <!-- Navigation Bottom Panel -->
    <div class="fixed bottom-0 left-0 w-full z-[50] p-6">
        <div class="max-w-md mx-auto bg-white/95 backdrop-blur-2xl rounded-[2.5rem] shadow-[0_25px_50px_-12px_rgba(0,0,0,0.2)] p-8 border border-white/50">
            <div class="flex items-center gap-6 mb-8">
                <div class="w-16 h-16 bg-primary/10 rounded-2xl flex items-center justify-center text-primary shadow-inner">
                    <span class="material-symbols-outlined text-4xl font-black">turn_slight_right</span>
                </div>
                <div class="flex-1">
                    <h2 class="text-xl font-black tracking-tight text-on-surface font-headline">Dans 350m</h2>
                    <p class="text-on-surface-variant font-medium text-sm leading-relaxed">Tournez à droite vers <span class="text-primary font-bold">Boulevard Mohamed V</span></p>
                </div>
            </div>
            
            <div class="flex gap-4">
                <button onclick="window.location.href='optimisation.html'" class="flex-1 py-5.5 bg-surface-container-low text-on-surface-variant font-black text-xs uppercase tracking-[0.2em] rounded-full active:scale-95 transition-all hover:bg-surface-container-high border-none">
                    Quitter
                </button>
                <button onclick="confirmArrival()" class="flex-[1.5] py-5.5 bg-primary text-white font-black text-xs uppercase tracking-[0.2em] rounded-full shadow-xl shadow-primary/20 active:scale-95 transition-all flex items-center justify-center gap-3 hover:bg-primary-dim border-none">
                    J'ai trouvé
                    <span class="material-symbols-outlined font-black">celebration</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Initialize Map — no zoom control for cleaner mobile feel
        const map = L.map('map', { 
            zoomControl: false,
            attributionControl: true
        }).setView([35.7780, -5.8030], 15);
        
        // Use a cleaner tile style
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Coordinates for the route (Simulated for Tangier)
        const routePoints = [
            [35.7725, -5.7940], // User Start
            [35.7745, -5.7975],
            [35.7770, -5.8020],
            [35.7795, -5.8070],
            [35.7820, -5.8115]  // Destination (Souk Msala)
        ];

        // Draw Route — solid line with glow effect
        const routeGlow = L.polyline(routePoints, {
            color: '#7e9cff',
            weight: 14,
            opacity: 0.3,
            lineJoin: 'round',
            lineCap: 'round'
        }).addTo(map);

        const routeLine = L.polyline(routePoints, {
            color: '#004edc',
            weight: 6,
            opacity: 0.9,
            lineJoin: 'round',
            dashArray: '1, 15',
            lineCap: 'round'
        }).addTo(map);

        // Add Destination Marker
        const destIcon = L.divIcon({
            className: 'custom-marker',
            html: '<div class="marker-destination"><span class="material-symbols-outlined">shopping_basket</span></div>',
            iconSize: [52, 52],
            iconAnchor: [26, 52]
        });
        L.marker([35.7820, -5.8115], { icon: destIcon }).addTo(map)
            .bindPopup('<div style="font-family:Manrope;font-weight:900;font-size:14px;padding:4px 8px;">Souk Msala</div>');

        // Add intermediate step marker
        const stepIcon = L.divIcon({
            className: 'custom-marker',
            html: '<div class="marker-step">2</div>',
            iconSize: [32, 32],
            iconAnchor: [16, 16]
        });
        L.marker([35.7770, -5.8020], { icon: stepIcon }).addTo(map);

        // Add User Marker
        const userIcon = L.divIcon({
            className: 'custom-marker',
            html: '<div class="marker-user"></div>',
            iconSize: [20, 20],
            iconAnchor: [10, 10]
        });
        const userMarker = L.marker([35.7725, -5.7940], { icon: userIcon }).addTo(map);

        // Fit map to show both start and end with padding for UI
        map.fitBounds(routeLine.getBounds(), { 
            padding: [120, 60],  // top/bottom, left/right
            maxZoom: 16
        });

        // Force map to recalculate size after DOM is ready
        setTimeout(() => {
            map.invalidateSize();
        }, 200);

        function recenterMap() {
            map.flyTo([35.7725, -5.7940], 17, { duration: 0.8 });
        }

        function confirmArrival() {
            alert('🎉 Magnifique ! Vous êtes arrivé à Souk Msala.\n\nVos économies sont à portée de main !');
            window.location.href = 'dashboard.html';
        }

        // Animate route flow
        let offset = 0;
        function animateRoute() {
            offset = (offset + 0.5) % 16;
            routeLine.setStyle({ dashOffset: -offset });
            requestAnimationFrame(animateRoute);
        }
        animateRoute();
    </script>
</body>
</html>
