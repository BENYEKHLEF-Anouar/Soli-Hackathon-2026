<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "on-surface-variant": "#595c5d",
                        "on-primary": "#f1f2ff",
                        "tertiary-container": "#ffffff",
                        "surface-dim": "#d1d5d7",
                        "outline": "#757778",
                        "on-primary-fixed-variant": "#002572",
                        "surface": "#f5f6f7",
                        "surface-variant": "#dadddf",
                        "on-error-container": "#510017",
                        "on-background": "#2c2f30",
                        "secondary": "#695c00",
                        "on-secondary-fixed-variant": "#675a00",
                        "on-secondary": "#fff3c0",

                        "error-dim": "#a70138",
                        "primary-fixed": "#7e9cff",
                        "tertiary-fixed-dim": "#f3f0ef",
                        "on-tertiary-fixed-variant": "#6e6d6c",
                        "surface-container": "#e6e8ea",
                        "on-surface": "#2c2f30",
                        "surface-tint": "#004edc",
                        "primary-fixed-dim": "#698dff",
                        "primary": "#004edc",

                        "inverse-primary": "#658aff",
                        "secondary-fixed": "#f9e04c",

                        "tertiary-dim": "#504f4f",

                        "on-error": "#ffefef",
                        "inverse-surface": "#0c0f10",
                        "secondary-fixed-dim": "#ead23f",
                        "on-primary-fixed": "#000000",
                        "error": "#b41340",
                        "secondary-container": "#f9e04c",
                        "on-tertiary-container": "#636262",
                        "tertiary-fixed": "#ffffff",
                        "primary-container": "#7e9cff",
                        "primary-dim": "#0043c1",

                    "borderRadius": {

                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }

            }
        }

<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f6f7;
        }
        h1, h2, h3 {
            font-family: 'Manrope', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col relative overflow-hidden">
<!-- Background Image Layer -->
<div class="fixed inset-0 z-0">
<img alt="" class="w-full h-full object-cover blur-sm brightness-105 scale-105" data-alt="Dreamy wide angle view of Tangier skyline at sunrise with soft hazy sunlight reflecting off Mediterranean waters and white buildings" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCPuvzDvTVD2_PLaz4S_4_dqWhJpwENUcEAF76qp3yMBvLmasbg6ml05ndeqDk_bmUiuHlRj5TKoWm8t9WS0yNbuKC8sYsIZcWrpqARKN8h2nOyb8vJ4tqWj4prVZrTJ9VbMBe0k2Ee0HRLvLbR2EcgL4CVIP2yXnoR-CsZ-fR03ZtNZv1gc8M4y-KsVozgwI__xn0KcKVuy9tiz4rTg-XCwds_0OkvzwnPShBcoO1LTGstTbYn6wfFbjlnrXIKs-adblCri3ZaXqbm"/>
<div class="absolute inset-0 bg-gradient-to-b from-white/20 via-transparent to-surface/80"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex-1 flex flex-col items-center px-6 pt-20 pb-12">
<!-- Brand Identity -->
<header class="mb-12 text-center">
<h1 class="text-5xl font-black tracking-tighter text-on-surface mb-2">Hawta</h1>
<p class="text-on-surface-variant font-medium tracking-tight text-sm uppercase">L'excellence au cœur de Tanger</p>
</header>
<!-- Glassmorphism Form Container -->
<div class="w-full max-w-sm glass-card rounded-xl p-8 shadow-[0_20px_40px_rgba(44,47,48,0.06)] ring-1 ring-white/40">
<div class="mb-8">
<h2 class="text-2xl font-bold text-on-surface tracking-tight">Bienvenue</h2>
<p class="text-on-surface-variant text-sm mt-1">Accédez à votre espace professionnel</p>
</div>
<form class="space-y-5">
<!-- Input Group: Email -->
<div class="space-y-1.5">
<label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant ml-1" for="email">Email address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant text-lg">mail</span>
<input class="w-full bg-surface-container-highest/30 border-none rounded-lg py-4 pl-12 pr-4 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 focus:bg-white/50 transition-all" id="email" placeholder="nom@exemple.com" type="email"/>
</div>
</div>
<!-- Input Group: Password -->
<div class="space-y-1.5">
<label class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant ml-1" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant text-lg">lock</span>
<input class="w-full bg-surface-container-highest/30 border-none rounded-lg py-4 pl-12 pr-4 text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary/20 focus:bg-white/50 transition-all" id="password" placeholder="••••••••" type="password"/>
</div>
<div class="text-right px-1">
<a class="text-xs font-semibold text-primary hover:text-primary-dim transition-colors" href="#">Mot de passe oublié ?</a>
</div>
</div>
<!-- Primary Action Button -->
<button class="w-full bg-[#2E7D32] hover:bg-[#1B5E20] text-white font-bold py-4 rounded-full shadow-lg shadow-green-900/10 transition-transform active:scale-95 flex items-center justify-center gap-2 mt-4" type="submit">
<span>Se connecter</span>
<span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</form>
<!-- Social/Secondary Login -->
<div class="mt-8 pt-8 border-t border-on-surface-variant/10 space-y-4">
<p class="text-center text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Ou continuer avec</p>
<div class="flex gap-4">
<button class="flex-1 bg-white/50 py-3 rounded-lg flex items-center justify-center border border-white/40 hover:bg-white transition-colors">
<img alt="" class="w-5 h-5" data-alt="Google logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA1KkIAldZAuOjNQWJBAGUK3ZamhVTTW2e2jVIpaf1Q6o0_XJ59rGC67aTPd6yBEvHzX546VeQahvOho4xhK39Vl5fIN-2KmXfM1WPcT9Px-JoTv0zfBrRJvBqp8DVtR4lN6NlT-wyR2InXmoj7slD3K7F5qkQjy03mDjS6rlEHx-zC5YstLJ-iNHRFWMc9s7IaUuHY5tm045g5unXD4KivxDlMtGZ8Hbn_FEBamav7XNxHeQmlTCeEpbdqmMqkgcLUGJqRQtwHX3dW"/>
</button>
<button class="flex-1 bg-white/50 py-3 rounded-lg flex items-center justify-center border border-white/40 hover:bg-white transition-colors">
<span class="material-symbols-outlined text-xl text-on-surface" data-weight="fill">ios</span>
</button>
</div>
</div>
</div>
<!-- Onboarding/Registration Suggestion -->
<div class="mt-10 text-center">
<p class="text-on-surface-variant text-sm">
                Nouveau sur Hawta ? 
                <a class="font-bold text-primary ml-1 underline-offset-4 hover:underline" href="#">Créer un compte</a>
</p>
</div>
<!-- Spacer to push footer down -->
<div class="flex-1"></div>
<!-- Professional Curator Footer -->
<footer class="mt-auto pt-8 pb-4 text-center">
<p class="text-on-surface-variant/60 font-body text-[11px] tracking-wide flex items-center justify-center gap-1.5">
                Made with <span class="material-symbols-outlined text-error text-[14px]" style="font-variation-settings: 'FILL' 1;">favorite</span> for Tanger
            </p>
<div class="flex justify-center gap-6 mt-4 text-[10px] font-bold uppercase tracking-widest text-on-surface-variant/40">
<a class="hover:text-primary transition-colors" href="#">Confidentialité</a>
<a class="hover:text-primary transition-colors" href="#">Conditions</a>
<a class="hover:text-primary transition-colors" href="#">Aide</a>
</div>
</footer>
</main>
<!-- Background Decoration: Subtle Tonal Shifts -->
<div class="fixed top-[-10%] right-[-5%] w-[400px] h-[400px] bg-primary/5 blur-[120px] rounded-full z-0 pointer-events-none"></div>
<div class="fixed bottom-[10%] left-[-10%] w-[300px] h-[300px] bg-secondary-container/10 blur-[100px] rounded-full z-0 pointer-events-none"></div>
</body></html>
